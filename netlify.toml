# SiliconSphere is a static site: no build step, files are published as-is.
[build]
  publish = "."
  command = ""

# Hash-based routing (#/domain/5, #/q/d05q012 …) means every deep link loads
# index.html directly, so no SPA rewrite is needed (and missing assets still 404).

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# JS/CSS are not fingerprinted, so let browsers cache but always revalidate
# (cheap 304s) — users never get a stale question bank after a deploy.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
